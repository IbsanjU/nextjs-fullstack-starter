version: '3.8'

services:
  # PostgreSQL Database (always available)
  postgres:
    image: postgres:16-alpine
    container_name: nextjs-starter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app']
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js App (optional, use --profile app to run)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs-starter-app
    restart: unless-stopped
    profiles:
      - app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - APP_ENV=local
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - LOG_LEVEL=info
      - ENABLE_DB=true
      - LOCAL_DB=true
      - DATABASE_URL=postgresql://app:app@postgres:5432/app?schema=public
      - NODE_ENV=development
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
